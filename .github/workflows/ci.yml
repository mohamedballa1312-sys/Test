# P0-05: tests, lint, dependency audit, image build and scan on every push and pull request.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - run: pip install -e ".[dev]" ruff pip-audit
      - name: Lint
        run: ruff check app tests ui
      - name: Dependency audit
        run: pip-audit --strict --no-deps -r requirements.lock
      - name: Unit tests
        env: { IQAMA_API_KEY: ci-test-key-0123456789, IQAMA_PURGE_INTERVAL_HOURS: "0" }
        run: pytest tests/unit -q -p no:warnings
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: "iqama-screener:ci", cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "iqama-screener:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - name: Caddy config check
        run: docker run --rm -e SITE_ADDRESS=example.com -e UI_USER=a -e UI_PASSWORD_HASH='$2a$14$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ012345678' -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" $(docker build -q -f deploy/Dockerfile.caddy deploy) caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
