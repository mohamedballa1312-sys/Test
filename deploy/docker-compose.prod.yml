# Production: API + UI behind Caddy (automatic HTTPS when DOMAIN is set, password-protected UI).
# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
services:
  api:
    build: ..
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      IQAMA_DATA_DIR: /srv/data
      IQAMA_OCR_PROVIDER: ${IQAMA_OCR_PROVIDER:-easyocr}
      IQAMA_ENC_KEY: ${IQAMA_ENC_KEY}
      IQAMA_API_KEY: ${IQAMA_API_KEY}
      IQAMA_WORKERS: ${IQAMA_WORKERS:-2}
      IQAMA_LOG_LEVEL: INFO
      IQAMA_PUBLIC_URL: ${IQAMA_PUBLIC_URL:-}
      IQAMA_PURGE_INTERVAL_HOURS: ${IQAMA_PURGE_INTERVAL_HOURS:-24}
      IQAMA_MAX_FILES_PER_UPLOAD: ${IQAMA_MAX_FILES_PER_UPLOAD:-200}
    volumes:
      - ../data:/srv/data
      - ../config:/srv/config
      - ocr-models:/home/app/.EasyOCR
    expose: ["8000"]
  ui:
    build: ..
    restart: unless-stopped
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false", "--server.maxUploadSize=200"]
    environment:
      IQAMA_API_BASE_URL: http://api:8000
      IQAMA_API_KEY: ${IQAMA_API_KEY}
    expose: ["8501"]
    depends_on: [api]
  caddy:
    # caddy with the rate-limit plugin (github.com/mholt/caddy-ratelimit) built in
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      UI_USER: ${UI_USER:-admin}
      UI_PASSWORD_HASH: ${UI_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ui, api]
volumes:
  ocr-models:
  caddy-data:
  caddy-config:
