[project]
name = "iqama-screener"
version = "0.1.0"
description = "Saudi Iqama screening and permit-file generation system (MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10",
  "rapidfuzz>=3.6",
  "structlog>=24",
  "cryptography>=41",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "requests>=2.31",
  "streamlit>=1.33",
]

[project.optional-dependencies]
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
easyocr = ["easyocr>=1.7"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
